<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<script src="../js/i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Kebab — Restaurant intelligent · Cuisine &amp; cafétéria</title>
<meta name="description" content="Bienvenue chez Kebab : scannez, commandez depuis votre table et savourez."/>
<link rel="manifest" href="../manifest.json"/>
<meta name="theme-color" content="#242120"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Kebab"/>
<link rel="icon" type="image/png" href="../images/brand/favicon-32.png?v=kebab2"/>
<link rel="apple-touch-icon" href="../images/brand/apple-touch-icon.png?v=kebab2"/>
<link rel="preload" as="image" href="../images/media/landing-coffee.jpg"/>
<link href="../css/fonts.css" rel="stylesheet"/>
<style>
    /* Page d'accueil du QR code : autonome (pas de Tailwind) pour s'afficher
       instantanément sur téléphone. Palette beige / expresso. */
    @view-transition { navigation: auto; }
    :root {
        --beige: #e9dcc6;
        --beige-2: #d9c3a5;
        --cream: #f6f0e7;
        --espresso: #242120;
        --ink: #2b1d14;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
        min-height: 100svh;
        font-family: 'DM Sans', system-ui, sans-serif;
        color: var(--cream);
        background: var(--espresso);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
    }
    .scene {
        position: relative;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        isolation: isolate;
        overflow: hidden; /* la photo légèrement zoomée ne déborde pas */
        padding: max(20px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    }
    .scene::before { /* photo du grill (kebab 2.jpg) */
        content: '';
        position: absolute;
        inset: 0;
        z-index: -2;
        background: url('../images/media/bienvenue-kebab.jpg') center 62% / cover no-repeat;
        transform: scale(1.06);
        animation: breathe 16s ease-in-out infinite alternate;
    }
    .scene::after { /* voile : lisibilité du titre en haut, du bouton en bas */
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
            linear-gradient(180deg, rgba(36, 33, 32, .85) 0%, rgba(36, 33, 32, .66) 30%, rgba(36, 33, 32, .4) 58%, rgba(36, 33, 32, .78) 84%, rgba(36, 33, 32, .96) 100%),
            radial-gradient(120% 60% at 50% 100%, rgba(217, 195, 165, .12), transparent 70%);
    }
    .top { display: flex; align-items: center; justify-content: space-between; animation: rise .9s cubic-bezier(.22,1,.36,1) both; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 48px; height: 44px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(233, 220, 198, .25)); }
    .brand span { font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: rgba(246, 240, 231, .8); }
    .table-chip {
        font-size: 12px; font-weight: 600; letter-spacing: .04em;
        padding: 7px 12px; border-radius: 999px;
        background: rgba(246, 240, 231, .12); border: 1px solid rgba(246, 240, 231, .22);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .table-chip[hidden] { display: none; }

    .headline { margin-top: clamp(28px, 7vh, 72px); text-align: center; animation: rise 1s .12s cubic-bezier(.22,1,.36,1) both; }
    .cup {
        width: 64px; height: 64px; margin: 0 auto 18px;
        display: grid; place-items: center;
        border-radius: 50%;
        background: linear-gradient(145deg, var(--beige), var(--beige-2));
        color: var(--espresso);
        box-shadow: 0 12px 30px -10px rgba(217, 195, 165, .6), inset 0 1px 0 rgba(255, 255, 255, .5);
    }
    .cup svg { width: 32px; height: 32px; }
    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--beige); }
    h1 {
        margin-top: 14px;
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 400;
        font-size: clamp(44px, 12vw, 84px);
        line-height: .98;
        letter-spacing: -0.025em;
        color: #fbf6ee;
        text-shadow: 0 8px 30px rgba(0, 0, 0, .45);
    }
    h1 em { display: block; font-style: italic; color: var(--beige); }
    .sub { margin: 16px auto 0; max-width: 20rem; font-size: 15px; line-height: 1.6; color: rgba(246, 240, 231, .85); text-shadow: 0 2px 14px rgba(0, 0, 0, .7); }

    .bottom { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; animation: rise 1s .28s cubic-bezier(.22,1,.36,1) both; }
    .cta {
        position: relative;
        width: min(100%, 360px);
        height: 60px;
        display: flex; align-items: center; justify-content: center; gap: 12px;
        border: 0; border-radius: 999px;
        background: linear-gradient(135deg, #f1e6d3 0%, var(--beige) 45%, var(--beige-2) 100%);
        color: var(--espresso);
        font-family: 'Fraunces', Georgia, serif;
        font-size: 20px; font-weight: 500; letter-spacing: .01em;
        text-decoration: none;
        box-shadow: 0 18px 40px -14px rgba(217, 195, 165, .75), inset 0 1px 0 rgba(255, 255, 255, .7), inset 0 -2px 0 rgba(120, 90, 60, .15);
        transition: transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s ease, filter .2s ease;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
    }
    .cta::before { /* reflet qui passe sur le bouton */
        content: '';
        position: absolute; top: 0; bottom: 0; left: -40%;
        width: 30%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent);
        transform: skewX(-18deg);
        animation: shine 4.5s 1.4s ease-in-out infinite;
    }
    .cta .arrow {
        width: 36px; height: 36px; border-radius: 50%;
        display: grid; place-items: center;
        background: var(--espresso); color: var(--beige);
        transition: transform .3s cubic-bezier(.22,1,.36,1);
    }
    .cta .arrow svg { width: 18px; height: 18px; }
    .cta:hover { transform: translateY(-2px); box-shadow: 0 24px 46px -14px rgba(217, 195, 165, .85), inset 0 1px 0 rgba(255, 255, 255, .7); }
    .cta:hover .arrow { transform: translateX(4px); }
    .cta:active { transform: scale(.98); }
    .cta:focus-visible { outline: 3px solid var(--beige); outline-offset: 4px; }
    .hint { font-size: 12.5px; color: rgba(246, 240, 231, .6); display: flex; align-items: center; gap: 8px; }
    .hint i { width: 6px; height: 6px; border-radius: 50%; background: #7fd49a; box-shadow: 0 0 0 0 rgba(127, 212, 154, .6); animation: ping 2s infinite; }
    .staff { margin-top: 2px; font-size: 12px; color: rgba(246, 240, 231, .45); text-decoration: none; padding: 8px; }
    .staff:hover { color: var(--beige); }

    /* Vapeur qui s'élève au-dessus de la tasse */
    .cup { position: relative; }
    .steam { position: absolute; left: 50%; bottom: 100%; width: 40px; height: 34px; margin-left: -20px; pointer-events: none; }
    .steam i { position: absolute; bottom: 0; width: 7px; height: 26px; border-radius: 8px; background: linear-gradient(to top, rgba(233, 220, 198, .55), transparent); filter: blur(2px); opacity: 0; animation: steam 3s ease-in-out infinite; }
    .steam i:nth-child(1) { left: 6px; }
    .steam i:nth-child(2) { left: 17px; animation-delay: 1s; }
    .steam i:nth-child(3) { left: 28px; animation-delay: 2s; }
    @keyframes steam { 0% { transform: translateY(8px) scaleY(.6); opacity: 0; } 35% { opacity: 1; } 100% { transform: translateY(-14px) scaleY(1.2) skewX(8deg); opacity: 0; } }

    body.leaving .scene { animation: leave .38s ease forwards; }

    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes breathe { from { transform: scale(1.06); } to { transform: scale(1.14) translateY(-1%); } }
    @keyframes shine { 0%, 60% { left: -40%; } 100% { left: 130%; } }
    @keyframes ping { 70% { box-shadow: 0 0 0 8px rgba(127, 212, 154, 0); } 100% { box-shadow: 0 0 0 0 rgba(127, 212, 154, 0); } }
    @keyframes leave { to { opacity: 0; transform: scale(1.02); filter: blur(2px); } }

    /* Trois étapes : scanner, commander, savourer */
    .steps { list-style: none; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 6px; }
    .steps li {
        display: inline-flex; align-items: center; gap: 7px;
        padding: 6px 12px 6px 6px; border-radius: 999px;
        font-size: 12.5px; font-weight: 500; color: rgba(246, 240, 231, .88);
        background: rgba(246, 240, 231, .08); border: 1px solid rgba(246, 240, 231, .16);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .steps b {
        width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
        font-size: 11px; font-weight: 700; background: var(--beige); color: var(--espresso);
    }
    .brand span b { color: var(--beige); font-weight: 600; }

    @media (min-width: 900px) {
        /* Grand écran : texte à gauche, grande photo arrondie à droite. */
        body { background: #242120; }
        .scene { padding: 36px 52% 40px clamp(48px, 7vw, 120px); }
        .scene::before {
            inset: 24px 24px 24px 50%;
            border-radius: 32px;
            background-position: center 60%;
            box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .8);
            transform: none;
            animation: none;
        }
        .scene::after {
            inset: 24px 24px 24px 50%;
            border-radius: 32px;
            background: linear-gradient(180deg, rgba(36, 33, 32, 0) 55%, rgba(36, 33, 32, .45) 100%);
            box-shadow: inset 0 0 0 1px rgba(246, 240, 231, .08);
        }
        .headline { margin-top: auto; text-align: left; max-width: 560px; }
        .cup { margin: 0 0 22px; }
        h1 { font-size: clamp(64px, 6.4vw, 104px); }
        .sub { margin: 20px 0 0; max-width: 26rem; font-size: 17px; text-shadow: none; }
        .bottom { margin-top: 40px; margin-bottom: auto; align-items: flex-start; max-width: 560px; }
        .steps { justify-content: flex-start; order: -1; margin-bottom: 14px; }
        .cta { width: 340px; }
        .table-chip { position: absolute; top: 44px; right: 48px; }
    }
    @media (max-height: 620px) {
        .headline { margin-top: 12px; }
        .cup { width: 52px; height: 52px; margin-bottom: 12px; }
        h1 { font-size: clamp(38px, 10vw, 60px); }
    }
    /* Grand écran : photo de largeur limitée, colonne de texte centrée
       (plus de grand vide entre le texte et la photo sur les écrans larges). */
    @media (min-width: 900px) {
        .scene {
            --photo-w: min(calc(50% - 24px), 780px);
            padding-right: calc(var(--photo-w) + 24px + clamp(40px, 5vw, 96px));
        }
        .scene::before, .scene::after { inset: 24px 24px 24px calc(100% - 24px - var(--photo-w)); }
        .top, .headline, .bottom { width: 100%; max-width: 580px; margin-left: auto; margin-right: auto; }
        .table-chip { right: calc(var(--photo-w) + 48px); }
    }
    /* Écran d'ordinateur peu haut (portable 1366×600…) : tout tient sans se chevaucher. */
    @media (min-width: 900px) and (max-height: 760px) {
        .scene { padding-top: 24px; padding-bottom: 24px; }
        .steam { display: none; }
        .cup { width: 48px; height: 48px; margin-bottom: 14px; }
        .cup svg { width: 24px; height: 24px; }
        h1 { font-size: clamp(48px, 9.5vh, 80px); }
        .sub { margin-top: 14px; }
        .bottom { margin-top: 26px; }
    }
    @media (prefers-reduced-motion: reduce) {
        *, .scene::before, .cta::before, .steam i { animation: none !important; transition: none !important; }
    }
</style>
</head>
<body>
<main class="scene">
    <header class="top">
        <div class="brand"><img src="../images/brand/logo.png?v=kebab2" alt="Kebab"/><span>Kebab</span></div>
        <span class="table-chip" id="table-chip" hidden></span>
    </header>

    <section class="headline" aria-labelledby="title">
        <div class="cup" aria-hidden="true">
            <span class="steam"><i></i><i></i><i></i></span>
            <!-- cloche de service (restaurant) -->
            <svg viewBox="0 -960 960 960" fill="currentColor"><path d="M80-200v-80h800v80H80Zm40-120v-40q0-128 78.5-226T400-710v-10q0-33 23.5-56.5T480-800q33 0 56.5 23.5T560-720v10q124 26 202 124t78 226v40H120Zm80-80h560q0-116-82-198t-198-82q-116 0-198 82t-82 198Zm280 0Z"/></svg>
        </div>
        <p class="eyebrow">Restaurant intelligent · Cuisine &amp; cafétéria</p>
        <h1 id="title">Bienvenue <em>à table.</em></h1>
        <p class="sub">Kebab, paninis, petits-déjeuners, desserts et cafés : installez-vous, commandez depuis votre table et laissez-nous faire le reste.</p>
    </section>

    <footer class="bottom">
        <ol class="steps" aria-label="Comment ça marche"><li><b>1</b> Scannez</li><li><b>2</b> Commandez</li><li><b>3</b> Savourez</li></ol>
        <a class="cta" id="start" href="../01-Identification/log.html">
            Commencer
            <span class="arrow" aria-hidden="true"><svg viewBox="0 -960 960 960" fill="currentColor"><path d="M647-440H160v-80h487L423-744l57-56 320 320-320 320-57-56 224-224Z"/></svg></span>
        </a>
        <p class="hint"><i></i> Commande à table · suivi en direct</p>
    </footer>
</main>
<script>
    // ?table=12 (QR code posé sur la table) : affiché ici et transmis à la
    // page de connexion, qui pré-remplit le numéro. Client déjà identifié :
    // « Commencer » ouvre TOUJOURS la page de connexion client ; si une session
    // existe déjà, cette page propose « Continuer » (rien n'est perdu).
    (function () {
        var params = new URLSearchParams(location.search);
        var table = (params.get('table') || '').trim().slice(0, 20);
        var start = document.getElementById('start');
        var chip = document.getElementById('table-chip');
        if (table && /^[0-9A-Za-z -]+$/.test(table)) {
            chip.textContent = 'Table ' + table;
            chip.hidden = false;
            start.href = '../01-Identification/log.html?table=' + encodeURIComponent(table);
        }
        // Transition douce vers la connexion quand le navigateur ne gère pas
        // les View Transitions entre pages.
        start.addEventListener('click', function (e) {
            if ('onpagereveal' in window || e.metaKey || e.ctrlKey) return;
            e.preventDefault();
            document.body.classList.add('leaving');
            setTimeout(function () { location.href = start.href; }, 320);
        });
    })();
</script>
</body>
</html>
